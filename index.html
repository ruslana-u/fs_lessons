<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 13</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <svg width="200" height="200" viewBox="-10 -10 200 200">
      <rect
        class="anim"
        width="100"
        height="100"
        fill="coral"
        stroke="brown"
        stroke-width="5"
      ></rect>
    </svg>
    <svg width="200" height="200" viewBox="-20 -40 200 200">
      <rect
        width="150"
        height="50"
        fill="pink"
        stroke="palevioletred"
        stroke-width="5"
      ></rect>
    </svg>
    <svg width="200" height="200">
      <circle
        cx="100"
        cy="50"
        r="45"
        fill="lightblue"
        stroke="royalblue"
        stroke-width="5"
      ></circle>
    </svg>
    <svg width="200" height="200">
      <ellipse
        cx="100"
        cy="150"
        rx="80"
        ry="30"
        fill="lightgreen"
        stroke="green"
        stroke-width="5"
      ></ellipse>
    </svg>
  </body>
</html>
